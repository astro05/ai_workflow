# Layers of this knowledge base: one row per product repo that writes specs here.
# Read by _kb/scripts/validate-kb.sh and by agents (.ai/ai.md → Paths). Humans own this file.
#
# layer     the name used in --layer, in each repo's .ai/kb.conf (LAYER=…) and in MODULE-MAP columns
# folder    spec folder under <Module>/Implementation/ (also the metadata row "<folder> Specs" in consumer specs)
# prefix    spec ID prefix: <prefix>-<Module>-NNN, or <prefix>-NNN in _cross-cutting
# index     registry file at the KB root
# repo      path of the layer's repo, relative to the KB root (env SDD_REPO_<LAYER> overrides, e.g. SDD_REPO_BACKEND)
# consumes  the layer whose §3 contracts this layer builds against, or "-"
#
# List provider layers before the layers that consume them: phases run in this order.
# A single-repo project keeps one row. Prefixes must be unique and must not be REQ.
#
# layer     folder     prefix  index                    repo          consumes
backend     Backend    SPEC    BACKEND-SPEC-INDEX.md    ../backend    -
frontend    Frontend   FE      FRONTEND-SPEC-INDEX.md   ../frontend   backend
